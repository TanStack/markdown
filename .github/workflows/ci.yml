name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      autolink_calibration:
        description: Run only isolated autolink measurement controls
        type: boolean
        default: false
      autolink_mode:
        description: Calibrate identical controls before candidate comparison
        type: choice
        options: [calibrate, compare]
        default: calibrate
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'workflow_dispatch' || !inputs.autolink_calibration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify
      - run: pnpm run corpus:audit:external

  consumers:
    if: github.event_name != 'workflow_dispatch' || !inputs.autolink_calibration
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        react: ['18.0', '19']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run test:package
        env:
          TEST_REACT_VERSION: ${{ matrix.react }}

  browsers:
    if: github.event_name != 'workflow_dispatch' || !inputs.autolink_calibration
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        react: ['18.0', '19']
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm add -D react@${{ matrix.react }} react-dom@${{ matrix.react }} --ignore-scripts --lockfile=false
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - run: pnpm run test:streaming-browser
        env:
          TEST_BROWSER: ${{ matrix.browser }}

  autolink-calibration:
    if: github.event_name == 'workflow_dispatch' && inputs.autolink_calibration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run isolated controls
        env:
          AUTOLINK_MODE: ${{ inputs.autolink_mode }}
        run: node scripts/bench-autolinks-compare.mjs artifacts/autolink-comparison "$AUTOLINK_MODE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: autolink-comparison-${{ github.sha }}-${{ inputs.autolink_mode }}
          path: artifacts/autolink-comparison
          retention-days: 7
