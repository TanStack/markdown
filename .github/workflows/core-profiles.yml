name: Escaping code negative controls
on:
  workflow_dispatch:
    inputs:
      gates:
        type: boolean
        default: false
        description: Run the combined source gates and size packet
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --expose-gc scripts/research/negative-escaping.mjs artifacts/escaping-negative-controls
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: escaping-negative-controls-${{ github.sha }}
          path: artifacts/escaping-negative-controls
          retention-days: 14
