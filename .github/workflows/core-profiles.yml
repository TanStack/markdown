name: Core workload profiles
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Profile frozen baseline, identical control and candidate in fresh processes
        run: |
          git worktree add "$RUNNER_TEMP/parser-baseline" ca59f585e292a4788cacb95e9729a2b9a4850d59
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/parser-baseline/node_modules"
          cd "$RUNNER_TEMP/parser-baseline"
          node --expose-gc --import tsx scripts/profile-core.mjs "$GITHUB_WORKSPACE/artifacts/shared-parser/baseline"
          node --expose-gc --import tsx scripts/profile-core.mjs "$GITHUB_WORKSPACE/artifacts/shared-parser/control"
          cd "$GITHUB_WORKSPACE"
          node --expose-gc --import tsx scripts/profile-core.mjs artifacts/shared-parser/candidate
          node scripts/research/compare-block-profiles.mjs artifacts/shared-parser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: shared-parser-${{ github.sha }}
          path: artifacts/shared-parser
          retention-days: 14
